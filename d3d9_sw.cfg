# d3d9_sw.cfg - put this next to default.exe with d3d9.dll.
#
# These are the settings save states were tested with. Every line is optional
# and an environment variable of the same name wins over it. Leave it as it is
# unless you are chasing a problem.

D3D9SW_SLOTFILE=1
D3D9SW_REWIND_NEWTHREADS=run

# Cross-session layout. The game's MSVCR100 allocations and our renderer's go
# to arenas at fixed addresses, so a second launch has them where the first did.
# DDPR is not large-address-aware, so everything sits under 2 GB: the small-block
# heap at 0x10000000 (20 MB used mid-stage), big blocks from 0x14000000 up to the fixed homes at
# 0x5FC00000. The game reserves no memory itself, so no raw span; there is no
# game.dll to pin. Set GAMEHEAP=0 to go back to the plain layout.
D3D9SW_GAMEHEAP=2
D3D9SW_GHPIN=0x10000000
#default is 64
D3D9SW_GHPIN_MB=48
D3D9SW_GHBIG_PIN=0x14000000
D3D9SW_GHBIG_PIN_MB=704
D3D9SW_GHRAW_PIN=0
D3D9SW_PIN_GAMEDLL=0

# Windows heaps made by the game, MSVCR100 or this DLL, in six 8 MB slots
# from 0x0D000000 up to the game heap at 0x10000000. 0 to let Windows place them.
D3D9SW_GHHEAPS=0x0D000000
D3D9SW_GHHEAPS_MB=8

# msvcrt allocators of d3dx9_43/d3dcompiler_43/XAudio2_7: 1 count only, 2 serve from the next GHHEAPS slot
D3D9SW_CRTTAP=2
# MSVCR100's own HeapAlloc on its heap served from the pinned arena
D3D9SW_GHRT_ALLOC=1
# XAudio2 2.7 through COM answered by the software engine; its voice arena in the 8 MB under the homes
D3D9SW_XA27=1
D3D9SW_XA2_ARENA=0x5F400000
D3D9SW_XA2_ARENA_MB=8
# never refuse over regions: write what can be written and let it crash
D3D9SW_EXCLFORCE=1
# DirectInput objects behind proxies at a fixed address, so restored device pointers stay valid
D3D9SW_DIPROXY=1
# wind the game's clock back to the save on load, so a save loaded minutes later does not see minutes pass in one frame
D3D9SW_REWIND_CLOCK=0

# big-block chunks past the 1204 MB span: a second fixed span, so they sit at the same addresses every launch
D3D9SW_GHBIG2_PIN=0x78000000
D3D9SW_GHBIG2_PIN_MB=96
# the shader compiler's heaps in the 8 MB slots too, so D3DX effects sit at the same addresses every launch
D3D9SW_GHHEAPS_DXC=1

# Manual play: cross-launch loads go through the merge (F5 save, Shift+F5 load)
D3D9SW_GHPLACE=1
D3D9SW_MERGE=1
D3D9SW_MERGE_TAKE=dat112.bin+328000,default.exe+111000,D000000:800000,F000000:1000000,10000000:3000000,14000000:2C000000,5F400000:800000,78000000:6000000,self
D3D9SW_MERGE_SITES=6830,732D
D3D9SW_MERGE_THREADS=1
D3D9SW_LOSE_DEVICE=30
# managed textures in a file pack in the game folder (copy it with the slots); their cache in the 500 MB above the 704 MB span
D3D9SW_TEXPACK=d3d9sw_pack
D3D9SW_TEXPACK_BASE=0x40000000
D3D9SW_TEXPACK_MB=500
